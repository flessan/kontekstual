name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-targets
      - name: Validate the example source
        run: cargo run -- check examples/halo.konteks
      - name: Run the example program
        run: |
          actual="$(cargo run --quiet -- run examples/halo.konteks)"
          expected="$(printf 'Halo dunia!\nProgram selesai.')"
          test "$actual" = "$expected"
          printf '%s\n' "$actual"
