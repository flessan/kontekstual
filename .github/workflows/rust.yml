name: Rust checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-targets
      - name: Validate the example source
        run: cargo run -- check examples/halo.konteks
      - name: Run the example program
        run: |
          actual="$(cargo run --quiet -- run examples/halo.konteks)"
          expected="$(printf 'Halo dunia!\nProgram selesai.')"
          test "$actual" = "$expected"
          printf '%s\n' "$actual"
      - name: Validate the variables and logic example
        run: cargo run -- check examples/variabel-dan-logika.konteks
      - name: Run the variables and logic example
        run: |
          actual="$(cargo run --quiet -- run examples/variabel-dan-logika.konteks)"
          expected="$(printf 'Halo, Thio!\n20\nbenar')"
          test "$actual" = "$expected"
          printf '%s\n' "$actual"
      - name: Validate the while loop example
        run: cargo run -- check examples/perulangan.konteks
      - name: Run the while loop example
        run: |
          actual="$(cargo run --quiet -- run examples/perulangan.konteks)"
          expected="$(printf '1\n2\n3\n4\n5\nPerulangan selesai.')"
          test "$actual" = "$expected"
          printf '%s\n' "$actual"

  playground:
    name: Browser playground compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
          run_install: false
      - name: Install playground dependencies
        run: pnpm install --frozen-lockfile
      - name: Test browser interpreter
        run: pnpm test
      - name: Build browser playground
        run: pnpm build
